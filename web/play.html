<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0e0f1a">
<title>Buzzworthy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
  input { user-select: text; -webkit-user-select: text; }
  .top { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 4px solid var(--c, var(--hot)); background: rgba(0,0,0,.2); }
  .top .name { font-weight: 800; font-size: 18px; }
  .top .name small { font-weight: 600; color: var(--muted); font-size: 12px; margin-left: 6px; }
  .top .score { font-family: var(--display); font-weight: 900; font-size: 22px; }
  .top .score.neg { color: var(--bad); }
  #app { flex: 1; display: flex; flex-direction: column; padding: 16px; gap: 14px; min-height: 0; }
  .center { flex: 1; display: flex; flex-direction: column; justify-content: safe center; align-items: center; text-align: center; gap: 14px; }
  .logo { font-family: var(--display); font-weight: 900; font-size: 36px; line-height: 1; color: var(--sun); }
  .msg { font-size: 20px; font-weight: 600; }
  .muted { color: var(--muted); }
  .err { color: var(--bad); min-height: 20px; }
  .stack { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 420px; }
  .buzzer { width: min(78vw, 46vh); height: min(78vw, 46vh); border-radius: 50%; font-family: var(--display); font-weight: 900; font-size: min(12vw, 7vh); color: #fff; touch-action: manipulation; transition: transform .06s, filter .2s, background .2s; border: 0; }
  .buzzer.idle { background: radial-gradient(circle at 35% 30%, #5a4a7a, #2a2140); box-shadow: 0 10px 0 #18122a; color: var(--muted); }
  .buzzer.live { background: radial-gradient(circle at 35% 30%, #ff8fb1, #e0245e 60%, #a1123d); box-shadow: 0 10px 0 #6d0b29, 0 0 40px rgba(255,93,143,.7); animation: glow .6s infinite alternate; }
  .buzzer.live:active { transform: translateY(8px); box-shadow: 0 2px 0 #6d0b29; }
  .buzzer.won { background: radial-gradient(circle at 35% 30%, #8ff5d2, #06d6a0 60%, #048a68); box-shadow: 0 10px 0 #035c45; }
  .buzzer.locked { background: radial-gradient(circle at 35% 30%, #555, #2b2b2b); box-shadow: 0 10px 0 #111; color: #888; }
  @keyframes glow { to { filter: brightness(1.15); } }
  .clueq { font-size: 17px; line-height: 1.35; background: var(--panel); padding: 12px 14px; border-radius: 14px; }
  .cat { font-family: var(--display); font-weight: 900; color: var(--sun); font-size: 14px; }
  .mini { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; flex: 1; grid-template-rows: auto repeat(5, 1fr); min-height: 0; }
  .mini .h { font-size: 9px; font-weight: 800; text-transform: uppercase; text-align: center; line-height: 1.1; display: flex; align-items: center; justify-content: center; padding: 4px 2px; background: var(--panel); border-bottom: 3px solid var(--col); border-radius: 6px; overflow-wrap: anywhere; hyphens: auto; }
  .mini button { padding: 0; font-family: var(--display); font-weight: 900; font-size: 13px; color: var(--ink); background: var(--col); border-radius: 8px; min-height: 44px; }
  .mini button:disabled { background: rgba(255,255,255,.04); color: transparent; opacity: 1; }
  .timer { height: 8px; border-radius: 8px; background: rgba(255,255,255,.1); overflow: hidden; width: 100%; }
  .timer i { display: block; height: 100%; background: linear-gradient(90deg, var(--c0), var(--sun)); transform-origin: left; }
  .captain { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 10px 16px 16px; border-top: 1px dashed rgba(255,255,255,.15); }
  .captain:empty { display: none; }
  .captain::before { content: 'Captain controls'; width: 100%; text-align: center; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
  .captain button { padding: 10px 14px; font-size: 14px; }
  .big { font-family: var(--display); font-weight: 900; font-size: 34px; line-height: 1.1; }
  .ok { color: var(--good); }
  .no { color: var(--bad); }
  .quick { display: flex; gap: 8px; }
  .quick button { flex: 1; padding: 10px 0; font-size: 14px; }
  .mini button.dd { color: var(--ink); background: #fff; box-shadow: inset 0 0 0 3px var(--col); }
  .mini button.dd::after { content: 'DD'; display: block; font-size: 9px; line-height: 1; }
  .mini button.dd:disabled { color: transparent; background: rgba(255,255,255,.12); box-shadow: none; }
  .mini button.dd:disabled::after { content: ''; }
  .clock { font-family: var(--display); font-weight: 900; font-size: 44px; color: var(--sun); line-height: 1; }
  .sheet { position: fixed; inset: 0; background: rgba(8,8,16,.75); display: none; align-items: flex-end; justify-content: center; z-index: 8; }
  .sheet.open { display: flex; }
  .sheet-in { width: 100%; max-width: 480px; max-height: 88vh; overflow: auto; background: var(--bg2); border-radius: 20px 20px 0 0; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .sheet .hd { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 18px; }
  .sheet .hd button { padding: 8px 14px; font-size: 14px; }
  .srow { display: grid; grid-template-columns: 1fr auto 44px 44px 52px; gap: 6px; align-items: center; background: var(--panel); border-left: 5px solid var(--c); border-radius: 12px; padding: 8px 8px 8px 12px; }
  .srow .n { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .srow b { font-family: var(--display); font-weight: 900; font-size: 15px; margin-right: 4px; }
  .srow b.neg { color: var(--bad); }
  .srow button { padding: 8px 0; font-size: 18px; }
  .srow button.set { font-size: 13px; }
  .streak { font-size: 14px; margin-left: 6px; }
  .reactbar { display: none; justify-content: center; gap: 6px; padding: 8px 12px 4px; }
  .reactbar.on { display: flex; }
  .reactbar button { flex: 1; max-width: 64px; font-size: 26px; padding: 8px 0; background: var(--panel); border: 1px solid var(--line); }
  .reactbar button:active { transform: scale(.9); }
  .times { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 360px; }
  .times div { display: flex; justify-content: space-between; background: var(--panel); border-left: 5px solid var(--c); border-radius: 10px; padding: 6px 12px; font-weight: 600; }
  .times div.me { outline: 2px solid var(--sun); }
  .times b { font-family: var(--display); font-weight: 700; font-size: 14px; }
  .mytime { font-family: var(--display); font-weight: 700; font-size: 16px; color: var(--ink); background: var(--sun); padding: 4px 12px; border-radius: 20px; }
  .award { background: var(--panel); border-top: 4px solid var(--sun); border-radius: 12px; padding: 8px 14px; }
  .award b { color: var(--sun); text-transform: uppercase; letter-spacing: .1em; font-size: 12px; display: block; }
  .kick { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .kick button { padding: 6px 10px; font-size: 13px; }
  .banner { position: fixed; top: 0; left: 0; right: 0; text-align: center; background: var(--bad); padding: 6px; font-weight: 600; display: none; z-index: 9; }
</style>
</head>
<body>
<div class="banner" id="conn">Reconnecting...</div>
<div class="top" id="top" style="display:none"></div>
<div id="app"></div>
<div class="reactbar" id="reactbar"></div>
<div class="captain" id="captain"></div>
<div class="sheet" id="scores"></div>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/cloud.js"></script>
<script src="/common.js"></script>
<script>
const params = new URLSearchParams(location.search);
let room = (params.get('room') || localStorage.getItem('bw-room') || '').toUpperCase();
let pid = null, S = null, screenKey = '', flash = '';
let scoresOpen = false, adjStep = 200;

function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function act(type, extra) { return BW.post('/api/act', { room, pid, type, ...extra }); }
function pname(id) { const p = S && S.players.find((x) => x.id === id); return p ? BW.esc(p.name) : 'Someone'; }
const app = document.getElementById('app');

function showJoin(error) {
  screenKey = 'join';
  document.getElementById('top').style.display = 'none';
  app.innerHTML = `
    <div class="center">
      <div class="logo">BUZZ<br>WORTHY</div>
      <div class="stack">
        <input id="room" placeholder="Room code" maxlength="4" autocapitalize="characters" value="${BW.esc(room)}" style="text-transform:uppercase;text-align:center;letter-spacing:.3em;font-family:var(--display);font-weight:900">
        <input id="name" placeholder="Your name" maxlength="16" value="${BW.esc(load('bw-name') || '')}">
        <button id="joinbtn">Join as a player</button>
        <button id="hostbtn" class="ghost">Join as the host</button>
        <div class="muted" style="font-size:13px;text-align:center">The host reads the clues, sees the answers, and decides who's right. Players then answer out loud.</div>
        <div class="err">${BW.esc(error || '')}</div>
      </div>
    </div>`;
  const go = async (asHost) => {
    const r = document.getElementById('room').value.trim().toUpperCase();
    const n = document.getElementById('name').value.trim();
    if (!r || !n) return showJoin('Enter the room code and your name.');
    const savedPid = load('bw-pid-' + r);
    const res = await BW.post('/api/join', { room: r, name: n, pid: savedPid, host: !!asHost });
    if (res.error) return showJoin(res.error);
    room = r; pid = res.pid;
    store('bw-room', r); store('bw-name', n); store('bw-pid-' + r, pid); store('bw-host-' + r, asHost ? '1' : '');
    history.replaceState(null, '', '/play?room=' + r);
    start();
  };
  document.getElementById('joinbtn').onclick = () => go(false);
  document.getElementById('hostbtn').onclick = () => go(true);
  document.getElementById('name').onkeydown = (e) => { if (e.key === 'Enter') go(false); };
}

let stop = null;
function start() {
  stop && stop();
  stop = BW.connect({ room, pid }, onState, (ok) => {
    document.getElementById('conn').style.display = ok ? 'none' : 'block';
  });
}

function onState(s) {
  const old = S;
  S = s;
  if (!S.me) { stop && stop(); store('bw-pid-' + room, ''); return showJoin(s.gone ? 'That game has ended. Enter the code on the TV to join a new one.' : 'You were removed from the game. Join again?'); }
  if (old && old.phase !== s.phase) flash = '';
  // Buzz feedback
  if (old && s.clue && s.clue.buzzedId === pid && s.phase === 'answering' && old.phase !== 'answering') navigator.vibrate && navigator.vibrate(120);
  render();
}

function renderTop() {
  if (S.me.isHost) {
    const t = document.getElementById('top');
    t.style.display = 'flex';
    t.style.setProperty('--c', 'var(--sun)');
    t.innerHTML = `<div class="name">${BW.esc(S.me.name)}<small>🎤 host · Room ${S.code}</small></div><div class="score" style="font-size:14px">${S.round ? (S.round === 3 ? 'FINAL' : 'ROUND ' + S.round) : ''}</div>`;
    return;
  }
  const me = S.players.find((p) => p.id === pid);
  const t = document.getElementById('top');
  t.style.display = 'flex';
  t.style.setProperty('--c', me ? me.color : '');
  const fire = me && me.streak >= (S.hotStreak || 3) ? `<span class="streak">&#128293;${me.streak}</span>` : '';
  t.innerHTML = `<div class="name">${me ? BW.esc(me.name) : ''}${fire}<small>${S.me.isCaptain ? '★ captain' : ''} · Room ${S.code}</small></div>
    <div class="score ${S.me.score < 0 ? 'neg' : ''}">${BW.money(S.me.score)}</div>`;
}

function renderCaptain() {
  const c = document.getElementById('captain');
  if (!S.me.isCaptain) { c.innerHTML = ''; return; }
  const ph = S.phase, b = [];
  if (ph === 'lobby') b.push(['start', 'Start game']);
  if (['reading', 'open', 'answering', 'dd-wager', 'dd-answer'].includes(ph)) b.push(['skip', 'Skip clue']);
  if (S.lastResult && ['reveal', 'open', 'board'].includes(ph)) b.push(['override', 'Flip last ruling']);
  if (['reveal', 'round-end', 'final-wager', 'final-answer', 'final-reveal'].includes(ph)) b.push(['advance', 'Continue']);
  if (ph === 'board') b.push(['endRound', 'End round early']);
  if (ph === 'gameover') b.push(['playAgain', 'Play again']);
  c.innerHTML = b.map(([t, l]) => `<button class="${t === 'start' || t === 'advance' || t === 'playAgain' ? '' : 'ghost'}" data-act="${t}">${l}</button>`).join('') +
    (ph !== 'lobby' && S.players.length ? '<button class="ghost" data-ui="scores">Fix scores</button>' : '');
}

// Host or captain can nudge any score up or down, or type an exact one.
function renderScores() {
  const el = document.getElementById('scores');
  if (!scoresOpen || !S || !S.me || !S.me.isCaptain) { el.classList.remove('open'); el.innerHTML = ''; return; }
  el.classList.add('open');
  el.innerHTML = `<div class="sheet-in">
    <div class="hd"><span>Fix scores</span><button data-ui="close">Done</button></div>
    <div class="muted" style="font-size:13px">Tap + or - to change a score by this much, or Set to type an exact score.</div>
    <div class="quick">${[100, 200, 500, 1000].map((n) => `<button class="${n === adjStep ? '' : 'ghost'}" data-step="${n}">$${n}</button>`).join('')}</div>
    ${S.players.map((p) => `<div class="srow" style="--c:${p.color}">
      <span class="n">${BW.esc(p.name)}</span><b class="${p.score < 0 ? 'neg' : ''}">${BW.money(p.score)}</b>
      <button class="ghost" data-adj="${p.id}" data-d="-1">&minus;</button>
      <button data-adj="${p.id}" data-d="1">+</button>
      <button class="ghost set" data-set="${p.id}">Set</button></div>`).join('')}
  </div>`;
}

document.addEventListener('click', (e) => {
  const u = e.target.closest('[data-ui]');
  if (u) { scoresOpen = u.dataset.ui === 'scores'; renderScores(); return; }
  if (e.target.id === 'scores') { scoresOpen = false; renderScores(); return; }
  const st = e.target.closest('[data-step]');
  if (st) { adjStep = Number(st.dataset.step); renderScores(); return; }
  const adj = e.target.closest('[data-adj]');
  if (adj) { act('adjustScore', { targetPid: adj.dataset.adj, delta: adjStep * Number(adj.dataset.d) }); return; }
  const set = e.target.closest('[data-set]');
  if (set) {
    const p = S.players.find((x) => x.id === set.dataset.set);
    if (!p) return;
    const v = prompt(`New score for ${p.name}:`, String(p.score));
    if (v === null) return;
    const n = Math.round(Number(String(v).replace(/[$,\s]/g, '')));
    if (!Number.isFinite(n)) return alert('That is not a number.');
    if (n !== p.score) act('adjustScore', { targetPid: p.id, delta: n - p.score });
    return;
  }
  const rx = e.target.closest('[data-react]');
  if (rx) { act('react', { e: Number(rx.dataset.react) }); navigator.vibrate && navigator.vibrate(15); return; }
  const kk = e.target.closest('[data-kick]');
  if (kk) {
    const p = S.players.find((x) => x.id === kk.dataset.kick);
    if (p && confirm(`Remove ${p.name} from the game?`)) act('kick', { targetPid: p.id });
    return;
  }
  const sec = e.target.closest('[data-sec]');
  if (sec) act('setAnswerTime', { seconds: Number(sec.dataset.sec) });
});

document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]');
  if (a) {
    if (a.dataset.act === 'endRound' && !confirm('End this round now?')) return;
    act(a.dataset.act, a.dataset.pack ? { pack: a.dataset.pack } : a.dataset.pid ? { targetPid: a.dataset.pid } : a.dataset.era ? { era: a.dataset.era } : a.dataset.r ? { r: a.dataset.r, ci: a.dataset.ci } : {}).then((r) => { if (r && r.error && r.error !== 'captain only') alert(r.error); });
  }
  const t = e.target.closest('[data-pick]');
  if (t) { const [ci, ri] = t.dataset.pick.split(','); act('pick', { ci, ri }); }
});

// Rebuild a screen only when it changes, so typing is not interrupted.
function setScreen(key, html, after) {
  if (key === screenKey) return false;
  screenKey = key;
  app.innerHTML = html;
  after && after();
  return true;
}

function easyButton(s) {
  if (!s.easyAvailable) return '';
  return `<button class="${s.easyMode ? '' : 'ghost'}" data-act="toggleEasy" style="text-align:left;border:2px solid var(--sun)">${s.easyMode ? '&#10003; ' : ''}&#9733; Easy mode <small style="opacity:.75;display:block;font-weight:600">${s.easyMode ? 'On: casual, family-friendly questions only. Tap to go back.' : 'Casual, family-friendly questions only'}</small></button>`;
}

// Archive era choice (Any, Classic, 2000s, Recent).
function eraButtons(s) {
  if (!s.hasArchive) return '';
  const note = s.archiveLoading ? 'Loading clues...' : s.archiveError ? 'Could not load that era. Try again.' : BW.seasonLabel(s.archiveSeason);
  return `<div class="muted">Clues from: ${BW.esc(note)}</div>
    <div class="quick" style="flex-wrap:wrap">${s.eras.map((e) => `<button class="${s.era === e ? '' : 'ghost'}" data-act="setEra" data-era="${e}" style="flex:1 1 45%">${BW.ERA_LABELS[e] || e}</button>`).join('')}</div>`;
}

// Packs list, or the board builder when a preview is open.
function packControls(s) {
  if (s.draft) {
    return `<div class="muted">Your board. Tap a category to swap it for another one.</div>
      ${s.draft.map((row, r) => `<div class="muted" style="font-size:12px;text-transform:uppercase;letter-spacing:.1em">Round ${r + 1}</div>
        ${row.map((name, ci) => `<button class="ghost" data-act="swapCategory" data-r="${r + 1}" data-ci="${ci}" style="text-align:left">&#8635; ${BW.esc(name)}</button>`).join('')}`).join('')}
      <div class="quick"><button class="ghost" data-act="previewBoard">Shuffle all</button><button class="ghost" data-act="clearPreview">Back to packs</button></div>`;
  }
  return `${easyButton(s)}
    <div class="muted">Question packs (${s.categoryCount} categories${s.categoryCount < 12 ? ', need 12+' : ''})</div>
    ${s.packs.map((pk) => `<button class="${pk.selected ? '' : 'ghost'}" data-act="togglePack" data-pack="${BW.esc(pk.id)}" style="text-align:left">${pk.selected ? '&#10003; ' : ''}${BW.esc(pk.title)} <small style="opacity:.7">${pk.count} categories</small></button>`).join('')}
    ${s.categoryCount >= 12 ? '<button data-act="previewBoard" style="border:2px solid var(--sun)">Preview and swap categories</button>' : ''}`;
}

// Changes whenever anything in the lobby setup changes, so the screen redraws.
function setupKey(s) {
  return [s.packs.map((pk) => (pk.selected ? 1 : 0)).join(''), s.easyMode, s.era, s.archiveSeason, s.archiveLoading, s.archiveError, s.draft ? s.draft.flat().join('|') : ''].join('/');
}

function answerForm(key, type, placeholder, extraHtml = '') {
  setScreen(key, `
    <div class="stack" style="margin:0 auto">
      ${extraHtml}
      <input id="ans" placeholder="${placeholder}" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="send">
      <button id="send">Lock it in</button>
      <div class="timer"><i data-timer-bar data-total="${S.duration}"></i></div>
      <div class="muted" style="text-align:center">No need to phrase it as a question. Small typos are OK.</div>
    </div>`, () => {
      const input = document.getElementById('ans');
      setTimeout(() => input.focus(), 50);
      const send = () => { act(type, { text: input.value }); input.blur(); };
      document.getElementById('send').onclick = send;
      input.onkeydown = (e) => { if (e.key === 'Enter') send(); };
    });
}

function wagerForm(key, type, min, max, extraHtml = '') {
  setScreen(key, `
    <div class="stack" style="margin:auto">
      ${extraHtml}
      <div class="msg">Wager between ${BW.money(min)} and ${BW.money(max)}</div>
      <input id="wager" type="number" inputmode="numeric" min="${min}" max="${max}" placeholder="Amount" style="text-align:center;font-family:var(--display);font-weight:900;font-size:28px">
      <div class="quick">
        <button class="ghost" data-w="${min}">Min</button>
        <button class="ghost" data-w="${Math.round(max / 2)}">Half</button>
        <button class="ghost" data-w="${max}">All in</button>
      </div>
      <button id="wbtn">Place wager</button>
      <div class="err" id="werr"></div>
    </div>`, () => {
      const input = document.getElementById('wager');
      app.querySelectorAll('[data-w]').forEach((b) => (b.onclick = () => { input.value = b.dataset.w; }));
      document.getElementById('wbtn').onclick = () => {
        const v = Number(input.value);
        if (!Number.isFinite(v) || input.value === '' || v < min || v > max) {
          document.getElementById('werr').textContent = `Pick a number from ${min} to ${max}.`;
          return;
        }
        act(type, { amount: v });
      };
    });
}

// Shown on the phone of whoever won the buzz.
function myTime(c) {
  return c && c.buzzMs != null ? `<span class="mytime">Buzzed in ${(c.buzzMs / 1000).toFixed(2)}s</span>` : '';
}

// Everyone's buzz time for this clue, fastest first.
function buzzTimes(c) {
  const list = (c && c.buzzes) || [];
  if (!list.length) return '';
  return `<div class="muted" style="font-size:12px;text-transform:uppercase;letter-spacing:.1em">Buzz times</div><div class="times">${list.map((b, i) => {
    const p = S.players.find((x) => x.id === b.pid);
    return `<div class="${b.pid === pid ? 'me' : ''}" style="--c:${p ? p.color : '#fff'}"><span>${i + 1}. ${p ? BW.esc(p.name) : 'Someone'}</span><b>${(b.ms / 1000).toFixed(2)}s</b></div>`;
  }).join('')}</div>`;
}

// Captain or host can remove a stray or duplicate player before the game starts.
function kickButtons(s) {
  const others = s.players.filter((p) => p.id !== pid);
  if (!others.length) return '';
  return `<div class="muted" style="font-size:13px">Tap a name to remove that player</div><div class="kick">${others.map((p) => `<button class="ghost" data-kick="${p.id}">&#10005; ${BW.esc(p.name)}</button>`).join('')}</div>`;
}

// Emoji reactions: everyone who is waiting can cheer or groan on the TV.
const REACTS = ['\u{1F44F}', '\u{1F602}', '\u{1F631}', '\u{1F525}', '\u{1F92F}', '\u{1F389}'];
function renderReacts() {
  const bar = document.getElementById('reactbar');
  const s = S, ph = s.phase, c = s.clue;
  let on = !s.me.isHost && ['lobby', 'board', 'answering', 'reveal', 'dd-wager', 'dd-answer', 'round-end', 'final-reveal', 'gameover'].includes(ph);
  if (ph === 'board' && s.controllerId === pid) on = false;
  if (ph === 'answering' && c && c.buzzedId === pid) on = false;
  if ((ph === 'dd-wager' || ph === 'dd-answer') && s.controllerId === pid) on = false;
  bar.classList.toggle('on', on);
  if (on && !bar.childElementCount) bar.innerHTML = REACTS.map((e, i) => `<button data-react="${i}">${e}</button>`).join('');
}

function render() {
  renderScores();
  renderReacts();
  if (S.me.isHost) { renderTop(); renderCaptain(); return renderHost(); }
  renderTop();
  renderCaptain();
  const s = S, ph = s.phase, c = s.clue;
  const meCtrl = s.controllerId === pid;

  if (ph === 'lobby') {
    const packHtml = s.me.isCaptain ? `<div class="stack" style="margin-top:8px">
        ${kickButtons(s)}
        ${eraButtons(s)}
        ${packControls(s)}
      </div>` : s.draft ? `<div class="muted">Board: ${s.draft.flat().map(BW.esc).join(', ')}</div>`
        : `<div class="muted">Packs: ${s.packs.filter((pk) => pk.selected).map((pk) => BW.esc(pk.title)).join(', ')}</div>`;
    return setScreen('lobby-' + s.players.map((p) => p.id).join('') + s.me.isCaptain + setupKey(s), `<div class="center" style="overflow:auto">
      <div class="logo">YOU'RE IN!</div>
      <div class="msg">${s.players.length} player${s.players.length === 1 ? '' : 's'} in the room</div>
      <div class="muted">${s.me.isCaptain ? 'You are the captain. Choose question packs, then tap Start game when everyone has joined.' : 'Waiting for the captain to start the game...'}</div>
      ${packHtml}
    </div>`);
  }

  if (ph === 'board') {
    const controllerOffline = !s.players.find((p) => p.id === s.controllerId)?.connected;
    // With a host, the player says their pick out loud and the host taps it.
    if (s.hostMode) {
      return setScreen('board-host-' + s.controllerId + meCtrl, `<div class="center">
        ${meCtrl ? `<div class="big" style="color:var(--sun)">YOUR PICK!</div>
          <div class="msg">Tell ${BW.esc(s.hostName || 'the host')} a category and an amount.</div>`
          : `<div class="msg"><b>${pname(s.controllerId)}</b> is picking a clue...</div>
          <div class="muted">Get your thumb ready.</div>`}</div>`);
    }
    const canPick = meCtrl || (s.me.isCaptain && controllerOffline);
    if (canPick) {
      const key = 'board-' + s.round + '-' + s.board.map((cc) => cc.clues.map((x) => (x.used ? 1 : 0)).join('')).join('');
      return setScreen(key, `
        <div class="msg" style="text-align:center">Your pick!</div>
        <div class="mini">
          ${s.board.map((cc, ci) => `<div class="h" style="--col:var(--c${ci})">${BW.esc(cc.name)}</div>`).join('')}
          ${[0, 1, 2, 3, 4].map((ri) => s.board.map((cc, ci) => `<button style="--col:var(--c${ci})" data-pick="${ci},${ri}" ${cc.clues[ri].used ? 'disabled' : ''}>${cc.clues[ri].value}</button>`).join('')).join('')}
        </div>`);
    }
    return setScreen('board-wait-' + s.controllerId, `<div class="center">
      <div class="msg"><b>${pname(s.controllerId)}</b> is picking a clue...</div>
      <div class="muted">Get your thumb ready.</div></div>`);
  }

  if (['reading', 'open', 'answering'].includes(ph)) {
    const clueHtml = `<div class="cat">${BW.esc(c.cat)} · $${c.value}</div><div class="clueq">${BW.esc(c.q)}</div>`;
    if (ph === 'answering' && c.buzzedId === pid) {
      if (s.hostMode) return setScreen('say-' + c.ci + c.ri + s.round + '-' + c.tried.length, `${clueHtml}<div class="center">
        <div class="big ok">YOU'RE UP!</div>${myTime(c)}
        <div class="msg">Say your answer out loud.</div>
        ${s.deadline ? '<div class="clock" data-timer-text data-zero="TIME!"></div><div class="timer"><i data-timer-bar data-total="' + s.duration + '"></i></div>' : ''}
        <div class="muted">${BW.esc(s.hostName || 'The host')} will decide if you're right.</div></div>`);
      return answerForm('ans-' + c.ci + c.ri + s.round + '-' + c.tried.length, 'answer', 'Your answer', `<div class="big ok" style="text-align:center">You got it!</div><div style="text-align:center">${myTime(c)}</div>${clueHtml}`);
    }
    let cls = 'idle', label = 'WAIT', sub = 'Buzzers unlock after the clue is read. Buzzing early locks you out briefly.';
    if (ph === 'open') { cls = 'live'; label = 'BUZZ!'; sub = 'Go go go!'; }
    if (c.tried.includes(pid)) { cls = 'locked'; label = 'OUT'; sub = 'You already took a shot at this one.'; }
    if (ph === 'answering') { cls = 'locked'; label = '...'; sub = `<b>${pname(c.buzzedId)}</b> buzzed in first${c.buzzMs != null ? ` (${(c.buzzMs / 1000).toFixed(2)}s)` : ''} and is answering.`; }
    if (flash) sub = flash;
    const key = `buzz-${c.ci}${c.ri}-${ph}-${cls}-${c.tried.length}-${flash}`;
    return setScreen(key, `${clueHtml}<div class="center">
      <button class="buzzer ${cls}" id="buzz">${label}</button>
      <div class="muted">${sub}</div></div>`, () => {
      const b = document.getElementById('buzz');
      b.addEventListener('pointerdown', async (e) => {
        e.preventDefault();
        // Taps after someone else won still count, so everyone gets a buzz time.
        if (!['reading', 'open', 'answering'].includes(S.phase)) return;
        const r = await act('buzz');
        const say = (msg, ms) => { flash = msg; screenKey = ''; render(); setTimeout(() => { if (flash === msg) { flash = ''; screenKey = ''; render(); } }, ms); };
        if (r.result === 'early') say('Too early! Wait for the red button.', 900);
        if (r.result === 'late') say(`Beaten to it! Your time: ${(r.ms / 1000).toFixed(2)}s`, 2500);
      });
    });
  }

  if (ph === 'dd-wager') {
    if (meCtrl) return wagerForm('dd-' + c.ci + c.ri, 'ddWager', 5, s.me.maxDD, `<div class="big" style="text-align:center;color:var(--sun)">DAILY DOUBLE!</div><div class="cat" style="text-align:center">${BW.esc(c.cat)}</div>`);
    return setScreen('ddw-' + c.ci + c.ri, `<div class="center"><div class="big" style="color:var(--sun)">DAILY DOUBLE!</div><div class="msg">${pname(s.controllerId)} is wagering...</div></div>`);
  }

  if (ph === 'dd-answer') {
    const clueHtml = `<div class="cat">${BW.esc(c.cat)} · Wager ${BW.money(c.wager)}</div><div class="clueq">${BW.esc(c.q)}</div>`;
    if (meCtrl && s.hostMode) return setScreen('ddsay-' + c.ci + c.ri, `${clueHtml}<div class="center">
        <div class="msg">Say your answer out loud.</div>
        <div class="muted">${BW.esc(s.hostName || 'The host')} will decide if you're right.</div></div>`);
    if (meCtrl) return answerForm('dda-' + c.ci + c.ri, 'answer', 'Your answer', clueHtml);
    return setScreen('ddaw-' + c.ci + c.ri, `${clueHtml}<div class="center"><div class="msg">${pname(s.controllerId)} is answering...</div></div>`);
  }

  if (ph === 'reveal') {
    const r = s.lastResult;
    const mine = r && r.pid === pid;
    return setScreen(`reveal-${c.ci}${c.ri}-${r ? r.correct : ''}-${(c.buzzes || []).length}`, `<div class="center">
      <div class="muted">The answer was</div>
      <div class="big" style="color:var(--sun)">${BW.esc(c.answer)}</div>
      ${mine ? `<div class="big ${r.correct ? 'ok' : 'no'}">${r.correct ? '+' : '-'}${BW.money(r.delta)}</div>` : ''}
      ${mine && r.correct && r.streak >= (s.hotStreak || 3) ? `<div class="msg">&#128293; You're on fire! ${r.streak} in a row</div>` : ''}
      ${buzzTimes(c)}
    </div>`);
  }

  if (ph === 'round-end') {
    return setScreen('re-' + s.round, `<div class="center"><div class="logo">ROUND ${s.round} DONE</div>
      <div class="msg">You have ${BW.money(s.me.score)}</div>
      <div class="muted">${s.round === 1 ? 'Round 2 doubles every value.' : 'The Final Showdown is next.'}</div></div>`);
  }

  if (ph === 'final-wager') {
    const f = s.final;
    if (!f.eligible.includes(pid)) return setScreen('fw-out', `<div class="center"><div class="msg">You need a positive score to play the Final Showdown.</div><div class="muted">Sit back and cheer!</div></div>`);
    if (s.me.finalWager !== undefined) return setScreen('fw-done', `<div class="center"><div class="msg">Wager locked: ${BW.money(s.me.finalWager)}</div><div class="muted">Waiting for everyone else...</div></div>`);
    return wagerForm('fw', 'finalWager', 0, s.me.score, `<div class="big" style="text-align:center;color:var(--sun)">FINAL SHOWDOWN</div><div class="cat" style="text-align:center;font-size:18px">${BW.esc(f.category)}</div>`);
  }

  if (ph === 'final-answer') {
    const f = s.final;
    if (!f.eligible.includes(pid)) return setScreen('fa-out', `<div class="center"><div class="clueq">${BW.esc(f.q)}</div><div class="muted">Play along in your head!</div></div>`);
    if (s.me.finalAnswer !== undefined) return setScreen('fa-done', `<div class="center"><div class="msg">Locked in: "${BW.esc(s.me.finalAnswer)}"</div><div class="muted">Waiting for the reveal...</div></div>`);
    return answerForm('fa', 'finalAnswer', 'Your final answer', `<div class="cat">${BW.esc(f.category)} · You wagered ${BW.money(s.me.finalWager)}</div><div class="clueq">${BW.esc(f.q)}</div>`);
  }

  if (ph === 'final-reveal') {
    const r = s.final.reveals.find((x) => x.id === pid);
    return setScreen('fr-' + (r ? r.correct : 'wait'), `<div class="center">
      ${r ? `<div class="muted">The answer was</div><div class="big" style="color:var(--sun)">${BW.esc(s.final.answer)}</div>
             <div class="big ${r.correct ? 'ok' : 'no'}">${r.correct ? 'Correct!' : 'Not quite'}</div>`
          : '<div class="msg">Watch the TV for the big reveal...</div>'}</div>`);
  }

  if (ph === 'gameover') {
    // Ties share a place, so two players on top are both champions.
    const place = s.players.filter((p) => p.score > s.me.score).length + 1;
    const tied = s.players.filter((p) => p.score === s.me.score).length > 1;
    const mine = (s.awards || []).filter((a) => a.pid === pid);
    return setScreen('go-' + place + s.me.score + mine.length, `<div class="center">
      <div class="logo">${place === 1 ? (tied ? "IT'S A TIE!" : 'YOU WIN!') : 'GAME OVER'}</div>
      <div class="msg">You finished ${tied ? 'tied for ' : ''}#${place} with ${BW.money(s.me.score)}</div>
      ${mine.map((a) => `<div class="award"><b>${BW.esc(a.title)}</b>${BW.esc(a.detail)}</div>`).join('')}</div>`);
  }
}

// ---------- host screens ----------
function renderHost() {
  const s = S, ph = s.phase, c = s.clue, sec = s.secret || {};
  const ansBox = (a, alt) => `<div style="background:rgba(255,209,102,.12);border:2px solid var(--sun);border-radius:14px;padding:10px 14px">
      <div class="muted" style="font-size:12px;text-transform:uppercase;letter-spacing:.1em">Answer (only you can see this)</div>
      <div style="font-family:var(--display);font-weight:900;font-size:24px;color:var(--sun)">${BW.esc(a || '')}</div>
      ${alt && alt.length ? `<div class="muted" style="font-size:13px">Also accept: ${alt.map(BW.esc).join(', ')}</div>` : ''}</div>`;
  const clueBlock = () => `<div class="cat">${BW.esc(c.cat)} · ${c.dd ? 'Daily Double' + (c.wager ? ' · wager ' + BW.money(c.wager) : '') : '$' + c.value}</div>
      <div class="clueq" style="font-size:20px">${BW.esc(sec.q || c.q || '')}</div>${ansBox(sec.answer, sec.alt)}`;
  const judgeBtns = `<div style="display:flex;gap:10px">
      <button data-judge="1" style="flex:1;padding:22px 0;font-size:22px;background:var(--good);color:#06241b">&#10003; Correct</button>
      <button data-judge="0" style="flex:1;padding:22px 0;font-size:22px;background:var(--bad)">&#10007; Wrong</button></div>`;

  if (ph === 'lobby') {
    return setScreen('h-lobby-' + s.players.map((p) => p.id).join('') + setupKey(s) + s.answerTime, `<div class="center" style="overflow:auto">
      <div class="logo">YOU'RE THE HOST</div>
      ${kickButtons(s)}
      <div class="msg">${s.players.length} player${s.players.length === 1 ? '' : 's'} joined</div>
      <div class="muted">You'll read each clue out loud, open the buzzers, and judge spoken answers. Tap Start game when everyone is in.</div>
      <div class="stack" style="margin-top:8px">
        <div class="muted">Answer timer after someone buzzes in</div>
        <div class="quick">${[5, 10, 15, 20, 0].map((n) => `<button class="${n === s.answerTime ? '' : 'ghost'}" data-sec="${n}">${n ? n + 's' : 'Off'}</button>`).join('')}</div>
        ${eraButtons(s)}
        ${packControls(s)}
      </div></div>`);
  }
  if (ph === 'board') {
    const dd = sec.dd || [];
    const ddLeft = s.board.reduce((n, cc, ci) => n + cc.clues.filter((x, ri) => !x.used && dd[ci] && dd[ci][ri]).length, 0);
    const key = 'h-board-' + s.round + s.controllerId + s.board.map((cc) => cc.clues.map((x) => (x.used ? 1 : 0)).join('')).join('') + JSON.stringify(dd);
    return setScreen(key, `
      <div class="msg" style="text-align:center">Ask <b>${pname(s.controllerId)}</b> for a pick.</div>
      <div class="muted" style="text-align:center;font-size:13px">They say a category and an amount, then you tap it here.${ddLeft ? ` White tiles are Daily Doubles (${ddLeft} left, only you can see them).` : ''}</div>
      <div class="mini">
        ${s.board.map((cc, ci) => `<div class="h" style="--col:var(--c${ci})">${BW.esc(cc.name)}</div>`).join('')}
        ${[0, 1, 2, 3, 4].map((ri) => s.board.map((cc, ci) => `<button style="--col:var(--c${ci})" class="${dd[ci] && dd[ci][ri] ? 'dd' : ''}" data-pick="${ci},${ri}" ${cc.clues[ri].used ? 'disabled' : ''}>${cc.clues[ri].value}</button>`).join('')).join('')}
      </div>`);
  }
  if (ph === 'reading') {
    return setScreen('h-read-' + c.ci + c.ri, `${clueBlock()}
      <div class="center">
        <div class="muted">Read the clue out loud, then open the buzzers.</div>
        <button data-act="openNow" style="width:100%;padding:24px 0;font-size:22px">Open buzzers</button>
      </div>`);
  }
  if (ph === 'open') {
    const r = s.lastResult;
    return setScreen('h-open-' + c.ci + c.ri + '-' + c.tried.length, `${clueBlock()}
      <div class="center">
        <div class="big" style="color:var(--good)">BUZZERS OPEN</div>
        ${r && !r.correct ? `<div class="muted">${pname(r.pid)} missed. Others can buzz in.</div>` : '<div class="muted">Waiting for someone to buzz in...</div>'}
        <div class="timer"><i data-timer-bar data-total="${s.duration}"></i></div>
      </div>`);
  }
  if (ph === 'answering' || ph === 'dd-answer') {
    const who = ph === 'answering' ? c.buzzedId : s.controllerId;
    return setScreen('h-judge-' + ph + c.ci + c.ri + who + c.tried.length, `${clueBlock()}
      <div class="center" style="gap:10px">
        <div class="msg"><b>${pname(who)}</b> is answering.</div>
        ${ph === 'answering' && s.deadline ? '<div class="clock" data-timer-text data-zero="Time\'s up!"></div><div class="timer"><i data-timer-bar data-total="' + s.duration + '"></i></div>' : ''}
        <div class="muted">Listen, then tap one:</div>
        <div style="width:100%">${judgeBtns}</div>
      </div>`);
  }
  if (ph === 'dd-wager') {
    return setScreen('h-ddw-' + c.ci + c.ri, `<div class="center">
      <div class="big" style="color:var(--sun)">DAILY DOUBLE!</div>
      <div class="msg">${pname(s.controllerId)} is choosing a wager on their phone.</div>
      <div class="clueq">${BW.esc(sec.q || '')}</div>${ansBox(sec.answer, sec.alt)}
      <div class="muted">Don't read the clue until they lock in a wager.</div></div>`);
  }
  if (ph === 'reveal') {
    const r = s.lastResult;
    return setScreen('h-rev-' + c.ci + c.ri + (r ? r.correct + '' + r.overridden : ''), `<div class="center">
      <div class="muted">The answer was</div>
      <div class="big" style="color:var(--sun)">${BW.esc(c.answer || sec.answer)}</div>
      ${r ? `<div class="msg">${pname(r.pid)} ${r.correct ? 'got it! &#10003;' : 'missed it. &#10007;'}</div>` : '<div class="msg">Nobody got it.</div>'}
      <div class="muted">Back to the board in a moment. Use Continue below to skip ahead.</div></div>`);
  }
  if (ph === 'round-end') {
    return setScreen('h-re-' + s.round, `<div class="center"><div class="logo">ROUND ${s.round} DONE</div>
      ${s.players.slice().sort((a, b) => b.score - a.score).map((p) => `<div class="msg">${BW.esc(p.name)}: ${BW.money(p.score)}</div>`).join('')}
      <div class="muted">Tap Continue when you're ready.</div></div>`);
  }
  if (ph === 'final-wager') {
    const f = s.final;
    return setScreen('h-fw-' + f.wagered.length, `<div class="center">
      <div class="big" style="color:var(--sun)">FINAL SHOWDOWN</div>
      <div class="msg">Category: ${BW.esc(f.category)}</div>
      <div class="muted">Players are wagering on their phones. Answers in this round are typed.</div>
      <div class="msg">${f.eligible.map((id) => `${pname(id)} ${f.wagered.includes(id) ? '&#10003;' : '...'}`).join('<br>')}</div>
      ${ansBox(sec.finalAnswer)}</div>`);
  }
  if (ph === 'final-answer') {
    const f = s.final, got = sec.finalAnswers || {};
    return setScreen('h-fa-' + f.answered.length, `<div class="center">
      <div class="clueq" style="font-size:20px">${BW.esc(f.q)}</div>${ansBox(sec.finalAnswer)}
      <div class="msg">${f.eligible.map((id) => `${pname(id)}: ${id in got ? '&#128274; ' + BW.esc(got[id] || '(blank)') : '...'}`).join('<br>')}</div>
      <div class="timer"><i data-timer-bar data-total="${s.duration}"></i></div></div>`);
  }
  if (ph === 'final-reveal' || ph === 'gameover') {
    const f = s.final;
    const rows = f ? f.reveals.map((r) => `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--panel);padding:10px 12px;border-radius:12px">
        <div><b>${pname(r.id)}</b>: "${BW.esc(r.answer)}" <span class="${r.correct ? 'ok' : 'no'}">${r.correct ? '&#10003;' : '&#10007;'}</span></div>
        <button class="ghost" style="padding:6px 10px;font-size:13px" data-act="finalOverride" data-pid="${r.id}">Flip</button></div>`).join('') : '';
    const key = 'h-fr-' + ph + (f ? f.reveals.map((r) => r.correct).join('') : '');
    return setScreen(key, `<div class="center" style="gap:10px">
      ${ph === 'gameover' ? '<div class="logo">GAME OVER</div>' : '<div class="msg">Revealing answers...</div>'}
      ${f ? `<div class="muted">Correct answer: <b>${BW.esc(f.answer || sec.finalAnswer)}</b></div>` : ''}
      <div class="stack">${rows}</div>
      <div class="muted">Typed answers are checked automatically. Tap Flip if one was judged wrong.</div></div>`);
  }
}

app.addEventListener('click', (e) => {
  const j = e.target.closest('[data-judge]');
  if (j) act('judge', { correct: j.dataset.judge === '1' });
});

BW.startTimerLoop(() => S);

(async () => {
  const savedPid = room && load('bw-pid-' + room);
  const name = load('bw-name');
  if (room && savedPid && name) {
    const res = await BW.post('/api/join', { room, name, pid: savedPid, host: load('bw-host-' + room) === '1' });
    if (!res.error) { pid = res.pid; return start(); }
    if (/not found/i.test(res.error)) room = '';
  }
  showJoin();
})();
</script>
</body>
</html>

name: Apple TV app

on:
  push:
    paths: ['tvos/**', '.github/workflows/tvos.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version && xcodebuild -showsdks | grep -i tv
      - name: Build for Apple TV (no signing)
        working-directory: tvos
        run: |
          xcodebuild -project BuzzworthyTV.xcodeproj -scheme BuzzworthyTV \
            -configuration Release -destination 'generic/platform=tvOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tail -n 60
          test ${PIPESTATUS[0]} -eq 0
      - name: Check the app bundle has the game files
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name BuzzworthyTV.app -path '*Release-appletvos*' | head -1)
          ls "$APP"
          for f in shim.js judge.js game.js rules.js hub.js default.json general.json Unbounded-Black.ttf Outfit-Regular.ttf Assets.car; do test -e "$APP/$f" || { echo "missing $f"; exit 1; }; done

  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Phone and Apple TV talk over Supabase
        working-directory: tvos/ci
        run: |
          npm init -y >/dev/null
          npm install @supabase/supabase-js@2 >/dev/null
          node protocol-test.js

  simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build for the Apple TV simulator
        working-directory: tvos
        run: |
          xcodebuild -project BuzzworthyTV.xcodeproj -scheme BuzzworthyTV -configuration Debug \
            -sdk appletvsimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 5
      - name: Boot a simulator and launch the app
        working-directory: tvos
        run: |
          xcrun simctl list runtimes
          DEV=$(xcrun simctl list devices available | grep -m1 'Apple TV 4K' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          if [ -z "$DEV" ]; then RT=$(xcrun simctl list runtimes | grep -m1 tvOS | sed -E 's/.* - (com\.apple[^ ]+).*/\1/'); DEV=$(xcrun simctl create bwtv "com.apple.CoreSimulator.SimDeviceType.Apple-TV-4K-3rd-generation-4K" "$RT"); fi
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install booted build/Build/Products/Debug-appletvsimulator/BuzzworthyTV.app
          xcrun simctl launch --console booted com.buzzworthy.party.tv > applog.txt 2>&1 &
          for i in $(seq 1 60); do grep -q BUZZWORTHY_ROOM applog.txt && break; sleep 1; done
          cat applog.txt | tail -20
          CODE=$(grep -o 'BUZZWORTHY_ROOM [A-Z]*' applog.txt | head -1 | awk '{print $2}')
          echo "ROOM=$CODE" >> $GITHUB_ENV
          sleep 4
      - name: Play part of a game from fake phones
        working-directory: tvos/ci
        run: |
          npm init -y >/dev/null
          npm install @supabase/supabase-js@2 >/dev/null
          node drive.js "$ROOM" ../shots
      - name: App log
        if: always()
        working-directory: tvos
        run: grep -i "buzzworthy" applog.txt | tail -40 || true
      - name: Print small copies of the screenshots
        if: always()
        working-directory: tvos/shots
        shell: bash {0}
        run: |
          for f in *.png; do
            sips -Z 1280 -s format jpeg -s formatOptions 60 "$f" --out "/tmp/${f%.png}.jpg" > /dev/null 2>&1 || echo "sips failed for $f"
            echo "SHOT_BEGIN $f"
            base64 < "/tmp/${f%.png}.jpg" | tr -d '\n' | fold -w 800
            echo
            echo "SHOT_END"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: tvos/shots

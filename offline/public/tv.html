<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buzzworthy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  body { overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 1.2vh 2vw; }
  .logo { font-family: 'Bungee', sans-serif; font-size: 3.2vh; letter-spacing: .05em; background: linear-gradient(90deg, var(--hot), var(--sun)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .joininfo { font-size: 2.2vh; color: var(--muted); }
  .joininfo b { color: var(--text); font-size: 2.8vh; letter-spacing: .15em; }
  main { flex: 1; position: relative; padding: 0 2vw; min-height: 0; display: flex; flex-direction: column; }
  footer { display: flex; gap: 1vw; padding: 1.5vh 2vw 2vh; justify-content: center; flex-wrap: wrap; }

  .chip { min-width: 12vw; background: var(--panel); border-radius: 1.4vh; padding: 1vh 1.4vw; border-top: .6vh solid var(--c); text-align: center; position: relative; transition: transform .2s, box-shadow .2s; }
  .chip .n { font-size: 2.2vh; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 16vw; }
  .chip .s { font-family: 'Bungee'; font-size: 3vh; }
  .chip .s.neg { color: var(--bad); }
  .chip.off { opacity: .45; }
  .chip.ctrl::after { content: 'PICKING'; position: absolute; top: -1.4vh; left: 50%; transform: translateX(-50%); font-size: 1.3vh; font-weight: 800; background: var(--sun); color: #1a1033; padding: .2vh .8vw; border-radius: 1vh; }
  .chip.buzzed { transform: translateY(-1.2vh) scale(1.08); box-shadow: 0 0 0 .4vh var(--c), 0 0 4vh var(--c); }

  /* Board */
  .board { flex: 1; display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: 1.25fr repeat(5, 1fr); gap: .8vh; min-height: 0; }
  .cat, .tile { border-radius: 1vh; display: flex; align-items: center; justify-content: center; text-align: center; }
  .cat { background: linear-gradient(160deg, #3a1c71, #24124a); font-family: 'Bungee'; font-size: 2.3vh; padding: .5vh .6vw; line-height: 1.15; text-transform: uppercase; }
  .tile { background: linear-gradient(160deg, var(--tile1), var(--tile2)); font-family: 'Bungee'; font-size: 5vh; color: var(--sun); cursor: pointer; text-shadow: 0 .4vh 0 rgba(0,0,0,.35); transition: transform .15s, filter .15s; }
  .tile:hover { filter: brightness(1.2); }
  .tile.used { background: rgba(255,255,255,.04); color: transparent; cursor: default; text-shadow: none; }
  .tile.picked { animation: flash .5s ease 2; }
  @keyframes flash { 50% { filter: brightness(2); transform: scale(1.05); } }
  .caption { text-align: center; font-size: 2.6vh; padding: 1vh 0; color: var(--muted); }
  .caption b { color: var(--text); }

  /* Clue */
  .clue { position: absolute; inset: 0 2vw; border-radius: 2vh; background: radial-gradient(circle at 30% 20%, #4b23a0, #1d0e46 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4vh 6vw; text-align: center; animation: zoom .35s ease; }
  @keyframes zoom { from { transform: scale(.6); opacity: 0; } }
  .clue .meta { position: absolute; top: 2.5vh; left: 3vw; right: 3vw; display: flex; justify-content: space-between; font-family: 'Bungee'; font-size: 2.6vh; color: var(--muted); }
  .clue .meta .v { color: var(--sun); }
  .clue .q { font-size: clamp(3vh, 6vh, 7vh); font-weight: 800; line-height: 1.25; max-width: 75vw; text-wrap: balance; }
  .clue .status { margin-top: 4vh; font-size: 3.2vh; font-weight: 600; min-height: 4.5vh; }
  .clue .status.go { color: var(--good); font-family: 'Bungee'; font-size: 4.2vh; animation: pulse .7s infinite alternate; }
  @keyframes pulse { to { transform: scale(1.06); } }
  .clue .ans { margin-top: 3vh; font-family: 'Bungee'; font-size: 5.5vh; color: var(--sun); animation: zoom .3s ease; }
  .result { margin-top: 2vh; font-size: 3vh; padding: 1vh 2vw; border-radius: 1.2vh; display: inline-block; }
  .result.ok { background: rgba(6,214,160,.18); color: var(--good); }
  .result.no { background: rgba(255,93,93,.15); color: var(--bad); }
  .timer { position: absolute; bottom: 0; left: 0; right: 0; height: 1.2vh; background: rgba(255,255,255,.08); border-radius: 0 0 2vh 2vh; overflow: hidden; }
  .timer i { display: block; height: 100%; background: linear-gradient(90deg, var(--hot), var(--sun)); transform-origin: left; }

  .splash { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 2vh; }
  .big { font-family: 'Bungee'; font-size: 11vh; line-height: 1; background: linear-gradient(90deg, var(--hot), var(--sun), var(--cool)); -webkit-background-clip: text; background-clip: text; color: transparent; animation: zoom .5s ease; }
  .sub { font-size: 3.2vh; color: var(--muted); }
  .sub b { color: var(--text); }

  /* Lobby */
  .lobby { flex: 1; display: grid; grid-template-columns: 1.1fr 1fr; gap: 4vw; align-items: center; }
  .lobby .title { font-family: 'Bungee'; font-size: 12vh; line-height: .95; background: linear-gradient(120deg, var(--hot), var(--sun) 60%, var(--cool)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lobby .tag { font-size: 3vh; color: var(--muted); margin: 2vh 0 4vh; }
  .steps { font-size: 2.6vh; line-height: 1.8; }
  .steps b { color: var(--sun); }
  .joinbox { background: var(--panel); border-radius: 3vh; padding: 4vh; text-align: center; }
  #qr { background: #fff; padding: 2vh; border-radius: 2vh; display: inline-block; }
  #qr svg { width: 34vh; height: 34vh; display: block; }
  .code { font-family: 'Bungee'; font-size: 9vh; letter-spacing: .2em; margin-top: 1vh; color: var(--sun); }
  .url { font-size: 2.3vh; color: var(--muted); word-break: break-all; }
  .roster { display: flex; flex-wrap: wrap; gap: 1vh; margin-top: 3vh; }
  .roster span { background: var(--c); color: #160b2e; font-weight: 800; padding: .8vh 1.6vw; border-radius: 4vh; font-size: 2.4vh; animation: zoom .3s ease; }

  .packs { margin-top: 3vh; display: flex; flex-wrap: wrap; gap: .8vh; }
  .packlabel { width: 100%; font-size: 1.9vh; color: var(--muted); }
  .pack { font-size: 2vh; padding: .8vh 1.2vw; background: var(--panel); color: var(--muted); border: 1px solid rgba(255,255,255,.15); font-weight: 600; }
  .pack.on { background: var(--cool); color: #10082a; border-color: transparent; font-weight: 800; }
  .pack small { opacity: .7; margin-left: .3vw; }
  .controls { position: fixed; right: 1.5vw; bottom: 13vh; display: flex; flex-direction: column; gap: .8vh; opacity: .25; transition: opacity .2s; z-index: 5; }
  .controls:hover { opacity: 1; }
  .controls button { font-size: 1.8vh; padding: .8vh 1.2vw; }

  .standings { display: flex; flex-direction: column; gap: 1.2vh; min-width: 40vw; }
  .standings .row { display: flex; justify-content: space-between; align-items: center; background: var(--panel); border-left: .8vh solid var(--c); padding: 1.4vh 2vw; border-radius: 1.2vh; font-size: 3.2vh; }
  .standings .row b { font-family: 'Bungee'; }
  .reveals { display: grid; grid-template-columns: repeat(auto-fit, minmax(22vw, 1fr)); gap: 2vh; width: 90%; }
  .rcard { background: var(--panel); border-top: .8vh solid var(--c); border-radius: 1.6vh; padding: 2vh; animation: zoom .35s ease; }
  .rcard .who { font-size: 2.6vh; font-weight: 800; }
  .rcard .what { font-size: 3.4vh; margin: 1vh 0; }
  .rcard .wager { font-size: 2.4vh; color: var(--muted); }
  .rcard.ok .what { color: var(--good); }
  .rcard.no .what { color: var(--bad); text-decoration: line-through; }
  .soundbtn { position: fixed; left: 1.5vw; bottom: 1.5vh; font-size: 1.6vh; opacity: .5; }
  .conn { position: fixed; top: 0; left: 50%; transform: translateX(-50%); background: var(--bad); color: #fff; padding: .5vh 2vw; border-radius: 0 0 1vh 1vh; font-weight: 600; display: none; }
</style>
</head>
<body>
<div class="conn" id="conn">Reconnecting to the game server...</div>
<header>
  <div class="logo">BUZZWORTHY</div>
  <div class="joininfo" id="joininfo"></div>
</header>
<main id="main"></main>
<footer id="footer"></footer>
<div class="controls" id="controls"></div>
<button class="soundbtn ghost" id="soundbtn">Sound: off (click to enable)</button>

<script src="/vendor/qrcode.js"></script>
<script src="/config.js"></script>
<script src="/vendor/supabase.js"></script>
<script src="/engine/judge.js"></script>
<script src="/engine/game.js"></script>
<script src="/engine/rules.js"></script>
<script src="/cloud.js"></script>
<script src="/common.js"></script>
<script>
let S = null, prev = null, joinUrl = '', room = null, tvKey = null;

async function init() {
  const params = new URLSearchParams(location.search);
  room = (params.get('room') || '').toUpperCase();
  tvKey = room && localStorage.getItem('bw-tv-' + room);
  if (!room || !tvKey || BW.cloud) {
    const r = await BW.post('/api/create', {});
    room = r.code; tvKey = r.tvKey;
    try { localStorage.setItem('bw-tv-' + room, tvKey); } catch (e) {}
    history.replaceState(null, '', '/?room=' + room);
  }
  // Phones need an address they can reach, so swap localhost for the LAN address.
  let host = location.host;
  if (/^(localhost|127\.|\[::1\])/.test(location.hostname)) {
    const info = await fetch('/api/info').then((r) => r.json()).catch(() => null);
    if (info && info.addresses[0]) host = info.addresses[0] + ':' + info.port;
  }
  const proto = host === location.host ? location.protocol : 'http:';
  joinUrl = `${proto}//${host}/play?room=${room}`;
  BW.connect({ room, tvKey }, onState, (ok) => { document.getElementById('conn').style.display = ok ? 'none' : 'block'; });
  BW.startTimerLoop(() => S);
}

function act(type, extra) { return BW.post('/api/act', { room, tvKey, type, ...extra }); }

function player(id) { return S.players.find((p) => p.id === id); }
function pname(id) { const p = player(id); return p ? BW.esc(p.name) : 'Someone'; }

function onState(s) {
  prev = S; S = s;
  playSounds(prev, S);
  render();
}

function playSounds(a, b) {
  if (!a) return;
  if (a.phase !== b.phase) {
    if (b.phase === 'reading') Sound.pick();
    if (b.phase === 'open' && a.phase === 'reading') Sound.open();
    if (b.phase === 'answering') Sound.buzz();
    if (b.phase === 'dd-wager') Sound.dd();
    if (b.phase === 'final-wager') Sound.dd();
    if (b.phase === 'gameover') Sound.fanfare();
    if (b.phase === 'reveal' && (!b.lastResult || !b.lastResult.correct) && a.phase === 'open') Sound.timeout();
  }
  const ra = a.lastResult, rb = b.lastResult;
  if (rb && (!ra || ra.pid !== rb.pid || ra.answer !== rb.answer || ra.correct !== rb.correct) && ['open', 'reveal'].includes(b.phase)) {
    rb.correct ? Sound.correct() : Sound.wrong();
  }
  if (b.final && a.final && b.final.revealIndex > a.final.revealIndex) {
    const r = b.final.reveals[b.final.revealIndex];
    r && (r.correct ? Sound.correct() : Sound.wrong());
  }
}

function render() {
  const s = S;
  document.getElementById('joininfo').innerHTML = s.phase === 'lobby' ? '' :
    `Join: <span>${BW.esc(joinUrl.replace(/^https?:\/\//, ''))}</span> &nbsp; Room <b>${s.code}</b>`;
  renderFooter();
  renderControls();
  const m = document.getElementById('main');
  const fn = {
    lobby: renderLobby, board: renderBoard, reading: renderClue, open: renderClue, answering: renderClue,
    reveal: renderClue, 'dd-wager': renderDDWager, 'dd-answer': renderClue, 'round-end': renderRoundEnd,
    'final-wager': renderFinalWager, 'final-answer': renderFinalAnswer, 'final-reveal': renderFinalReveal, gameover: renderGameOver,
  }[s.phase];
  fn && fn(m);
}

function renderFooter() {
  const f = document.getElementById('footer');
  if (S.phase === 'lobby') { f.innerHTML = ''; return; }
  const buzzed = S.clue && S.clue.buzzedId;
  f.innerHTML = S.players.map((p) => `
    <div class="chip ${p.connected ? '' : 'off'} ${S.phase === 'board' && p.id === S.controllerId ? 'ctrl' : ''} ${buzzed === p.id && S.phase === 'answering' ? 'buzzed' : ''}" style="--c:${p.color}">
      <div class="n">${BW.esc(p.name)}</div>
      <div class="s ${p.score < 0 ? 'neg' : ''}">${BW.money(p.score)}</div>
    </div>`).join('');
}

function renderControls() {
  const c = document.getElementById('controls');
  const b = [];
  const ph = S.phase;
  if (ph === 'lobby' && S.players.length) b.push(['start', 'Start game (S)']);
  if (S.hostMode && ph === 'reading') b.push(['openNow', 'Open buzzers (B)']);
  if (S.hostMode && (ph === 'answering' || ph === 'dd-answer')) { b.push(['judge-1', 'Correct (C)']); b.push(['judge-0', 'Wrong (W)']); }
  if (['reading', 'open', 'answering', 'dd-wager', 'dd-answer'].includes(ph)) b.push(['skip', 'Skip clue (K)']);
  if (S.lastResult && ['reveal', 'open', 'board'].includes(ph)) b.push(['override', 'Flip last ruling (O)']);
  if (['reveal', 'round-end', 'final-wager', 'final-answer', 'final-reveal'].includes(ph)) b.push(['advance', 'Continue (N)']);
  if (ph === 'board') b.push(['endRound', 'End round early']);
  if (ph === 'gameover') b.push(['playAgain', 'Play again']);
  c.innerHTML = b.map(([t, l]) => `<button class="ghost" data-act="${t}">${l}</button>`).join('');
}

document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]');
  if (a && a.dataset.act.startsWith('judge-')) act('judge', { correct: a.dataset.act === 'judge-1' });
  else if (a) act(a.dataset.act, { pid: a.dataset.pid, pack: a.dataset.pack });
  const t = e.target.closest('[data-pick]');
  if (t && S.phase === 'board') { const [ci, ri] = t.dataset.pick.split(','); act('pick', { ci, ri }); }
});
document.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 's' && S.phase === 'lobby') act('start');
  if (k === 'k') act('skip');
  if (k === 'b') act('openNow');
  if (k === 'c') act('judge', { correct: true });
  if (k === 'w') act('judge', { correct: false });
  if (k === 'o') act('override');
  if (k === 'n' || k === 'enter' || k === ' ') act('advance');
});
document.getElementById('soundbtn').onclick = (e) => {
  Sound.enable();
  e.target.textContent = 'Sound: on';
};

function renderLobby(m) {
  if (!m.querySelector('.lobby')) {
    m.innerHTML = `
      <div class="lobby">
        <div>
          <div class="title">BUZZ<br>WORTHY</div>
          <div class="tag">The trivia showdown where your phone is the buzzer.</div>
          <div class="steps">
            <div><b>1.</b> Scan the code with your phone camera</div>
            <div><b>2.</b> Type your name and join</div>
            <div id="hostline"></div>
          </div>
          <div class="roster" id="roster"></div>
          <div class="packs" id="packs"></div>
        </div>
        <div class="joinbox">
          <div id="qr"></div>
          <div class="code">${S.code}</div>
          <div class="url">${BW.esc(joinUrl)}</div>
        </div>
      </div>`;
    try {
      const qr = qrcode(0, 'M');
      qr.addData(joinUrl);
      qr.make();
      document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
    } catch (e) { document.getElementById('qr').style.display = 'none'; }
  }
  document.getElementById('hostline').innerHTML = S.hostMode
    ? `<b>3.</b> Host: <span style="color:var(--sun)">${BW.esc(S.hostName)}</span> 🎤 Players answer out loud.`
    : '<b>3.</b> Want a host? They tap <i>Join as the host</i>. Otherwise players type answers.';
  document.getElementById('packs').innerHTML = `<div class="packlabel">Question packs (tap to switch on or off) &middot; ${S.categoryCount} categories${S.categoryCount < 12 ? ' <span style="color:var(--bad)">need at least 12</span>' : ''}</div>` +
    S.packs.map((pk) => `<button class="pack ${pk.selected ? 'on' : ''}" data-act="togglePack" data-pack="${BW.esc(pk.id)}" title="${BW.esc(pk.description)}">${pk.selected ? '&#10003; ' : ''}${BW.esc(pk.title)} <small>${pk.count}</small></button>`).join('');
  document.getElementById('roster').innerHTML = S.players.length
    ? S.players.map((p) => `<span style="--c:${p.color}">${BW.esc(p.name)}${p.id === S.captainId ? ' ★' : ''}</span>`).join('')
    : '<div class="sub">Waiting for players...</div>';
}

function renderBoard(m) {
  const picked = prev && prev.clue;
  m.innerHTML = `
    <div class="board">
      ${S.board.map((c) => `<div class="cat">${BW.esc(c.name)}</div>`).join('')}
      ${[0, 1, 2, 3, 4].map((ri) => S.board.map((c, ci) => {
        const cl = c.clues[ri];
        return `<div class="tile ${cl.used ? 'used' : ''}" data-pick="${ci},${ri}">${cl.used ? '' : '$' + cl.value}</div>`;
      }).join('')).join('')}
    </div>
    <div class="caption"><b>${pname(S.controllerId)}</b>, pick a clue on your phone. Round ${S.round} of 2.</div>`;
}

function resultLine() {
  const r = S.lastResult;
  if (!r) return '';
  const amt = BW.money(r.delta);
  return `<div class="result ${r.correct ? 'ok' : 'no'}">${pname(r.pid)}${r.answer == null ? '' : `: "${BW.esc(r.answer)}"`} ${r.correct ? '&#10003; +' + amt : '&#10007; -' + amt}${r.overridden ? ' (ruling flipped)' : ''}</div>`;
}

function renderClue(m) {
  const c = S.clue;
  let status = '';
  if (S.phase === 'reading') status = S.hostMode ? `<div class="status">${BW.esc(S.hostName || 'The host')} is reading the clue...</div>` : '<div class="status">Get ready...</div>';
  if (S.phase === 'open') status = `<div class="status go">BUZZ IN!</div>${resultLine()}`;
  if (S.phase === 'answering') status = S.hostMode
    ? `<div class="status"><b style="color:${player(c.buzzedId)?.color}">${pname(c.buzzedId)}</b> buzzed in! Say your answer!</div>`
    : `<div class="status"><b style="color:${player(c.buzzedId)?.color}">${pname(c.buzzedId)}</b> buzzed in! Answering... <span data-timer-text></span></div>`;
  if (S.phase === 'dd-answer') status = `<div class="status"><b>${pname(S.controllerId)}</b> wagered <b>${BW.money(c.wager)}</b>. Answering... <span data-timer-text></span></div>`;
  if (S.phase === 'reveal') status = `<div class="ans">${BW.esc(c.answer)}</div>${S.lastResult ? resultLine() : '<div class="sub">Nobody buzzed in.</div>'}`;
  const showTimer = S.hostMode ? S.phase === 'open' : ['open', 'answering', 'dd-answer'].includes(S.phase);
  m.innerHTML = `
    <div class="clue">
      <div class="meta"><span>${BW.esc(c.cat)}</span><span class="v">${c.dd ? 'DAILY DOUBLE' : '$' + c.value}</span></div>
      <div class="q">${BW.esc(c.q)}</div>
      ${status}
      ${showTimer ? `<div class="timer"><i data-timer-bar data-total="${S.duration}"></i></div>` : ''}
    </div>`;
}

function renderDDWager(m) {
  m.innerHTML = `<div class="splash">
    <div class="big">DAILY<br>DOUBLE!</div>
    <div class="sub">${BW.esc(S.clue.cat)}</div>
    <div class="sub"><b>${pname(S.controllerId)}</b> is choosing a wager...</div>
  </div>`;
}

function standings() {
  return `<div class="standings">${S.players.slice().sort((a, b) => b.score - a.score).map((p) =>
    `<div class="row" style="--c:${p.color}"><span>${BW.esc(p.name)}</span><b>${BW.money(p.score)}</b></div>`).join('')}</div>`;
}

function renderRoundEnd(m) {
  m.innerHTML = `<div class="splash">
    <div class="big">${S.round === 1 ? 'ROUND 1 DONE' : 'ROUND 2 DONE'}</div>
    <div class="sub">${S.round === 1 ? 'Next up: <b>Double Up</b>, where every value doubles.' : 'Next up: <b>the Final Showdown</b>.'}</div>
    ${standings()}
    <div class="sub">The captain taps Continue to keep going.</div>
  </div>`;
}

function renderFinalWager(m) {
  const f = S.final;
  m.innerHTML = `<div class="splash">
    <div class="big">FINAL SHOWDOWN</div>
    <div class="sub">Category</div>
    <div class="big" style="font-size:7vh">${BW.esc(f.category)}</div>
    <div class="sub">Place your wagers on your phones.</div>
    <div class="sub">${f.eligible.map((id) => `${pname(id)} ${f.wagered.includes(id) ? '&#10003;' : '...'}`).join(' &nbsp; ')}</div>
  </div>`;
}

function renderFinalAnswer(m) {
  const f = S.final;
  m.innerHTML = `
    <div class="clue">
      <div class="meta"><span>${BW.esc(f.category)}</span><span class="v">FINAL SHOWDOWN</span></div>
      <div class="q">${BW.esc(f.q)}</div>
      <div class="status">${f.eligible.map((id) => `${pname(id)} ${f.answered.includes(id) ? '&#128274;' : '...'}`).join(' &nbsp; ')} &nbsp; <span data-timer-text></span></div>
      <div class="timer"><i data-timer-bar data-total="${S.duration}"></i></div>
    </div>`;
}

function revealCards() {
  return `<div class="reveals">${S.final.reveals.map((r) => `
    <div class="rcard ${r.correct ? 'ok' : 'no'}" style="--c:${player(r.id)?.color}">
      <div class="who">${pname(r.id)}</div>
      <div class="what">${BW.esc(r.answer)}</div>
      <div class="wager">Wagered ${BW.money(r.wager)} ${r.correct ? '&#10003;' : '&#10007;'}${r.overridden ? ' (flipped)' : ''}
        <button class="ghost" style="font-size:1.4vh;padding:.3vh .6vw;margin-left:.5vw" data-act="finalOverride" data-pid="${r.id}">flip</button></div>
    </div>`).join('')}</div>`;
}

function renderFinalReveal(m) {
  const f = S.final;
  m.innerHTML = `<div class="splash">
    <div class="sub">${BW.esc(f.q)}</div>
    <div class="big" style="font-size:7vh">${BW.esc(f.answer || '')}</div>
    ${revealCards()}
  </div>`;
}

function renderGameOver(m) {
  const sorted = S.players.slice().sort((a, b) => b.score - a.score);
  const w = sorted[0];
  m.innerHTML = `<div class="splash">
    <div class="sub">And the champion is...</div>
    <div class="big" style="color:${w ? w.color : ''}">${w ? BW.esc(w.name) : 'Nobody!'}</div>
    ${S.final && S.final.answer ? `<div class="sub">Final answer: <b>${BW.esc(S.final.answer)}</b></div>` : ''}
    ${standings()}
    <div class="sub">The captain can tap Play Again for a fresh board.</div>
  </div>`;
}

init();
</script>
</body>
</html>
